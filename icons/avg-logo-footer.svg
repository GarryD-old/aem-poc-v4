<svg width="98" height="40" viewBox="0 0 98 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AVG">
  <!-- Flat AVG pinwheel mark: rounded square split into four colour segments -->
  <g>
    <clipPath id="avg-cube">
      <rect x="2" y="6" width="28" height="28" rx="5"/>
    </clipPath>
    <g clip-path="url(#avg-cube)">
      <!-- centre of the pinwheel at (16,20) -->
      <polygon points="16,20 2,6 30,6" fill="#78be20"/>
      <polygon points="16,20 30,6 30,34" fill="#ffc20e"/>
      <polygon points="16,20 30,34 2,34" fill="#f37021"/>
      <polygon points="16,20 2,34 2,6" fill="#e4002b"/>
    </g>
  </g>
  <!-- AVG wordmark in white -->
  <text x="37" y="28" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="-0.5">AVG</text>
</svg>
